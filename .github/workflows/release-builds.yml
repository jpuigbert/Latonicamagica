name: Release builds

# Compila La Tònica Màgica per a Linux (tar.gz) i Windows (exe) i adjunta els
# binaris al release de GitHub indicat. (La versió macOS es construeix des del
# mateix Mac amb ./build_app.sh i s'adjunta com a DMG; la CI no corre en un Mac
# Intel, per això no la regenera aquí.)
#
# Disparadors:
#   - En publicar un release (automàtic; usa l'etiqueta del release).
#   - Manualment:  gh workflow run release-builds.yml --ref main -f tag=v1.0.0

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Etiqueta del release on pujar els binaris (p. ex. v1.0.0)"
        required: true
        default: "v1.0.0"

jobs:
  # ------------------------------------------------------------------ Linux
  linux:
    name: Build · Linux (tar.gz)
    runs-on: ubuntu-latest
    container:
      image: swift:5.9-jammy
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Compila el CLI amb SwiftPM
        run: |
          set -euo pipefail
          cd Multiplataforma
          swift build -c release
          mkdir -p out/LaTonicaCLI
          cp "$(swift build -c release --show-bin-path)/laTonicaCLI" out/LaTonicaCLI/laTonicaCLI-linux
          cp COM-INSTALAR-linux.txt out/LaTonicaCLI/
      - name: Crea el tar.gz
        run: |
          set -euo pipefail
          cd Multiplataforma/out && tar czf ../../LaTonicaCLI-linux.tar.gz LaTonicaCLI
      - uses: actions/upload-artifact@v4
        with:
          name: linux-tar
          path: LaTonicaCLI-linux.tar.gz

  # ---------------------------------------------------------------- Windows
  windows:
    name: Build · Windows (exe)
    runs-on: windows-latest
    # Millor esforç: si l'eina Swift de Windows no queda ben instal·lada a la
    # runners, el job es marcarà groc però NO bloquejarà la publicació de Linux.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Instal·la el Visual C++ Redistributable (DLLs de runtime)
        shell: pwsh
        # La toolchain Swift per a Windows enllaça contra vcruntime140/msvcp140.
        # Sense aquestes DLLs, «swift.exe» mor amb 0xC0000135 (STATUS_DLL_NOT_FOUND).
        run: |
          $ErrorActionPreference = "Continue"
          $vc = "$env:RUNNER_TEMP\vc_redist.x64.exe"
          Invoke-WebRequest "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile $vc
          $p = Start-Process -FilePath $vc -ArgumentList "/install /quiet /norestart" -Wait -PassThru
          Write-Host "vc_redist exit: $($p.ExitCode)"
      - name: Instal·la el Swift toolchain per a Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          # Python és necessari pel driver de Swift a Windows.
          (Get-Command python -ErrorAction SilentlyContinue) | Out-Null
          $url = "https://download.swift.org/swift-5.9.2-release/windows10/swift-5.9.2-RELEASE/swift-5.9.2-RELEASE-windows10.exe"
          Invoke-WebRequest $url -OutFile "$env:RUNNER_TEMP\swift.exe"
          $p = Start-Process -FilePath "$env:RUNNER_TEMP\swift.exe" -ArgumentList "/S" -Wait -PassThru
          Write-Host "Installer exit: $($p.ExitCode)"
          Start-Sleep -Seconds 10
          $bin = (Get-ChildItem "C:\Library\Developer\Toolchains" -Recurse -Filter swift.exe -ErrorAction SilentlyContinue |
                  Where-Object { $_.FullName -match '\\usr\\bin\\' } | Select-Object -First 1).DirectoryName
          "SWIFT_BIN=$bin"    | Out-File -FilePath $env:GITHUB_ENV  -Append -Encoding utf8
          $bin                 | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          Write-Host "Swift toolchain a: $bin"
          # La comprovació «--version» és només informativa: si l'eina triga a
          # registrar-se pot tornar un codi != 0 immediatament. No l'hem de
          # deixar com a error del pas; el veritable gate és el «swift build».
          & "$bin\swift.exe" --version 2>&1 | ForEach-Object { Write-Host $_ }
          exit 0
      - name: Compila el CLI
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          # Carrega l'entorn de Visual Studio (cl/link + SDK) perquè SwiftPM pugui enllaçar.
          # vswhere.exe viu a «Program Files (x86)", no a «Program Files".
          $vswhere = @(
            "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe",
            "${env:ProgramFiles}\Microsoft Visual Studio\Installer\vswhere.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $vswhere) { Write-Host "::error::No s'ha trobat vswhere.exe"; exit 1 }
          $vs = & $vswhere -latest -property installationPath
          Import-Module (Join-Path $vs "Common7\Tools\Microsoft.VisualStudio.DevShell.dll")
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments "-arch=x64 -host_arch=x64"
          $env:Path = "$env:SWIFT_BIN;$env:Path"
          # DIAGNÒSTIC: confirma que swift.exe arrenca i ensenya la versió real.
          Write-Host "--- swift --version ---"
          & "$env:SWIFT_BIN\swift.exe" --version 2>&1 | ForEach-Object { Write-Host $_ }
          Write-Host "exit version = $LASTEXITCODE"
          Set-Location Multiplataforma
          Write-Host "--- swift build -c release ---"
          & "$env:SWIFT_BIN\swift.exe" build -c release 2>&1 | Tee-Object -Variable buildout | ForEach-Object { Write-Host $_ }
          Write-Host "exit build = $LASTEXITCODE"
          # Localitza el binari real (el «--show-bin-path» pot venir buit o en
          # diverses línies; busquem el .exe sota .build, que és infal·lible).
          $exe = Get-ChildItem -Path .build -Recurse -Filter laTonicaCLI.exe -ErrorAction SilentlyContinue |
                 Select-Object -First 1
          if (-not $exe) { Write-Host "::error::No s'ha generat laTonicaCLI.exe"; exit 1 }
          Write-Host "Binari: $($exe.FullName)"
          New-Item -ItemType Directory -Force -Path pkg\LaTonicaCLI | Out-Null
          Copy-Item $exe.FullName pkg\LaTonicaCLI\laTonicaCLI-windows.exe
          Copy-Item COM-INSTALAR-windows.txt pkg\LaTonicaCLI\ -ErrorAction SilentlyContinue
      - name: Empaqueta el ZIP
        shell: pwsh
        run: Compress-Archive -Path Multiplataforma\pkg\LaTonicaCLI -DestinationPath LaTonicaCLI-windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: LaTonicaCLI-windows.zip

  # --------------------------------------------------------------- Publicació
  publish:
    name: Puja els binaris al release
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: "*"
          path: assets
          merge-multiple: true
      - name: Reanomena amb la versió i puja a l'release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.tag || github.event.release.tag_name }}
        run: |
          set -uo pipefail
          [ -f assets/LaTonicaCLI-linux.tar.gz ]  && mv assets/LaTonicaCLI-linux.tar.gz  assets/LaTonicaCLI-linux-${TAG}.tar.gz
          [ -f assets/LaTonicaCLI-windows.zip ]   && mv assets/LaTonicaCLI-windows.zip   assets/LaTonicaCLI-windows-${TAG}.zip
          if ls assets/* >/dev/null 2>&1; then
            gh release upload "$TAG" assets/* --clobber
            echo "Assets publicats per a $TAG:"
            gh release view "$TAG" --json assets --jq '.assets[].name'
          else
            echo "Cap binari per publicar (cap artifact present)."
          fi
